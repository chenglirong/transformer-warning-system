<?xml version="1.0" encoding="UTF-8"?>
<!--
  图4.2 七步工作流执行流程 — CVPR 风格重绘版
  内容与 七步工作流.svg 完全一致，仅改配色与线型
  原图保留于 七步工作流.svg，本文件不覆盖原图
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="880" height="430"
     viewBox="0 0 880 430"
     font-family="Hiragino Sans GB W6"><defs><marker id="amCA6F1E" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#CA6F1E"/></marker><marker id="am5D6D7E" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#5D6D7E"/></marker></defs>

  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ===== 上排（左→右）===== -->

  <!-- 起始节点 -->
  <rect x="30" y="30" width="100" height="50" rx="25"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="2"/>
  <text x="80" y="60" text-anchor="middle"
        fill="#155230" font-size="18" font-weight="600">七种气体</text>

  <!-- ① 气体读取 -->
  <rect x="160" y="30" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="215" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">① 气体读取</text>

  <!-- ② 检测分级 -->
  <rect x="300" y="30" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="355" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">② 检测分级</text>

  <!-- ③ 产气趋势 -->
  <rect x="440" y="30" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="495" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">③ 产气趋势</text>

  <!-- 判断菱形C1 -->
  <polygon points="645,18 710,55 645,92 580,55"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="2"/>
  <text x="645" y="44" text-anchor="middle"
        fill="#7D3C0A" font-size="16" font-weight="600">含量超</text>
  <text x="645" y="70" text-anchor="middle"
        fill="#7D3C0A" font-size="16" font-weight="600">注意值？</text>

  <!-- 上排箭头 -->
  <line x1="133" y1="55" x2="157" y2="55" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <line x1="270" y1="55" x2="297" y2="55" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <line x1="413" y1="55" x2="437" y2="55" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <line x1="553" y1="55" x2="577" y2="55" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  

  <!-- ===== 右侧拐弯（下）===== -->

  <!-- ④ 处置紧急度 -->
  <rect x="540" y="125" width="120" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">④ 处置紧急度</text>

  <!-- 判断菱形C2 -->
  <polygon points="600,213 688,255 600,297 512,255"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="2"/>
  <text x="600" y="244" text-anchor="middle"
        fill="#7D3C0A" font-size="16" font-weight="600">含量超或</text>
  <text x="600" y="270" text-anchor="middle"
        fill="#7D3C0A" font-size="16" font-weight="600">涨势预警？</text>

  <!-- C1 是 → ④ -->
  <line x1="645" y1="92" x2="645" y2="119" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <text x="660" y="110" fill="#5D6D7E" font-size="14" font-weight="600">是</text>

  <!-- ④ → C2 -->
  <line x1="600" y1="175" x2="600" y2="207" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  

  <!-- 跳过边1：C1否→C2（虚线） -->
  <polyline points="710,55 745,55 745,255 692,255"
        fill="none" stroke="#CA6F1E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#amCA6F1E)"/>
  
  <text x="758" y="145" fill="#CA6F1E" font-size="14" font-weight="600">否，跳过</text>

  <!-- ===== 下排（右→左）===== -->

  <!-- C2 是 → ⑤ -->
  <line x1="600" y1="297" x2="600" y2="334" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <text x="615" y="322" fill="#5D6D7E" font-size="14" font-weight="600">是</text>

  <!-- ⑤ 故障判型 -->
  <rect x="545" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="600" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">⑤ 故障判型</text>

  <!-- ⑥ 监测决策 -->
  <rect x="405" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="460" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">⑥ 监测决策</text>

  <!-- ⑦ 报告生成 -->
  <rect x="265" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="2"/>
  <text x="320" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="18" font-weight="600">⑦ 报告生成</text>

  <!-- 终端节点 -->
  <rect x="60" y="340" width="170" height="50" rx="25"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="2"/>
  <text x="145" y="370" text-anchor="middle"
        fill="#155230" font-size="18" font-weight="600">分析结论与报告</text>

  <!-- 下排箭头 -->
  <line x1="545" y1="365" x2="521" y2="365" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <line x1="405" y1="365" x2="381" y2="365" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  
  <line x1="265" y1="365" x2="236" y2="365" stroke="#5D6D7E" stroke-width="2" marker-end="url(#am5D6D7E)"/>
  

  <!-- 跳过边2：C2否→⑥（虚线） -->
  <polyline points="512,255 455,255 455,333"
        fill="none" stroke="#CA6F1E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#amCA6F1E)"/>
  
  <text x="448" y="290" text-anchor="end" fill="#CA6F1E" font-size="14" font-weight="600">否，跳过</text>

</svg>
