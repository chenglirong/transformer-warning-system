  <ns0:rect x="240" y="760" width="140" height="24" rx="5" class="yellow" />
  <ns0:text x="310" y="776" text-anchor="middle" class="small">5.2 核心功能模块</ns0:text>
  <ns0:line x1="380" y1="772" x2="398" y2="772" class="arrow" />
  <ns0:rect x="400" y="760" width="140" height="24" rx="5" class="yellow" />
  <ns0:text x="470" y="776" text-anchor="middle" class="small">5.3 数据库与数据流</ns0:text>
  <ns0:line x1="540" y1="772" x2="558" y2="772" class="arrow" />
  <ns0:rect x="560" y="760" width="140" height="24" rx="5" class="yellow" />
  <ns0:text x="630" y="776" text-anchor="middle" class="small">5.4 原型界面展示</ns0:text>

  <ns0:text x="380" y="806" text-anchor="middle" class="small">完成从气体数据输入、规则判定、智能体编排到分析报告导出的端到端落地</ns0:text>

  <ns0:line x1="380" y1="824" x2="380" y2="848" class="arrow" />

  
  <ns0:rect x="292" y="850" width="176" height="34" rx="14" fill="#ffffff" stroke="#6aa3d8" stroke-width="2" stroke-dasharray="8 6" />
