<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" font-family="Hiragino Sans GB W6">
  <ns0:defs>
    <ns0:marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <ns0:polygon points="0,0 5,2.5 0,5" fill="#66717d"/>
    </ns0:marker>
    <ns0:style>
      .frame { fill: #ffffff; stroke: #6aa3d8; stroke-width: 2; stroke-dasharray: 8 6; }
