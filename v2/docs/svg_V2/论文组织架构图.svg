  <ns0:text x="204" y="250" text-anchor="middle" fill="#1a5276" font-size="16" font-weight="700">第2章　检测分级与预警智能分类</ns0:text>

  <ns0:rect x="84" y="262" width="240" height="22" rx="5" class="blue" />
