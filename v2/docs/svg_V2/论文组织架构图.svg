  <ns0:line x1="318" y1="610" x2="654" y2="610" class="line" />
  <ns0:line x1="318" y1="610" x2="318" y2="618" class="arrow" />
  <ns0:line x1="430" y1="610" x2="430" y2="618" class="arrow" />
  <ns0:line x1="542" y1="610" x2="542" y2="618" class="arrow" />
  <ns0:line x1="654" y1="610" x2="654" y2="618" class="arrow" />

  <ns0:rect x="265" y="620" width="106" height="38" rx="5" class="box" />
  <ns0:text x="318" y="635" text-anchor="middle" class="small" font-size="14">第2、3章</ns0:text>
  <ns0:text x="318" y="650" text-anchor="middle" class="small" font-size="14">规则算法</ns0:text>
  <ns0:rect x="377" y="620" width="106" height="38" rx="5" class="box" />
  <ns0:text x="430" y="635" text-anchor="middle" class="small" font-size="14">4.4.1</ns0:text>
  <ns0:text x="430" y="650" text-anchor="middle" class="small" font-size="14">监测决策机制</ns0:text>
  <ns0:rect x="489" y="620" width="106" height="38" rx="5" class="box" />
  <ns0:text x="542" y="635" text-anchor="middle" class="small" font-size="14">4.4.2</ns0:text>
  <ns0:text x="542" y="650" text-anchor="middle" class="small" font-size="14">分析报告生成</ns0:text>
  <ns0:rect x="601" y="620" width="106" height="38" rx="5" class="box" />
  <ns0:text x="654" y="635" text-anchor="middle" class="small" font-size="14">4.4.3</ns0:text>
  <ns0:text x="654" y="650" text-anchor="middle" class="small" font-size="14">判据角标绑定</ns0:text>

  <ns0:text x="380" y="680" text-anchor="middle" class="small">承接第2、3章规则模块，按固定顺序编排，形成可复现、可追溯的智能体分析流程</ns0:text>

  <ns0:line x1="380" y1="690" x2="380" y2="714" class="arrow" />

  
  <ns0:rect x="52" y="716" width="656" height="108" rx="18" class="frame" />
  <ns0:text x="380" y="740" text-anchor="middle" class="chapter">第5章　变压器油中溶解气体分析预警系统设计与实现</ns0:text>

  <ns0:rect x="80" y="760" width="140" height="24" rx="5" class="yellow" />
  <ns0:text x="150" y="776" text-anchor="middle" class="small">5.1 系统总体架构</ns0:text>
