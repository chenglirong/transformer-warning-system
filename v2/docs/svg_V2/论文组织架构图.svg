  <ns0:rect x="400" y="230" width="312" height="248" rx="8" class="panel" />
  <ns0:text x="556" y="250" text-anchor="middle" fill="#1e6b3a" font-size="16" font-weight="700">第3章　多规则协同故障类型判断</ns0:text>

  <ns0:rect x="436" y="262" width="240" height="22" rx="5" class="green" />
