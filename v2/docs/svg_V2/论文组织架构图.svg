      .yellow { fill: #fffbea; stroke: #e8d9a8; stroke-width: 1; }
      .title { fill: #1f2d3d; font-size: 16px; font-weight: 700; }
      .chapter { fill: #2c3e50; font-size: 14px; font-weight: 700; }
      .text { fill: #2c3e50; font-size: 12px; font-weight: 600; }
      .small { fill: #566573; font-size: 12px; font-weight: 600; }
      .label { fill: #66717d; font-size: 12px; font-weight: 600; }
      .arrow { stroke: #66717d; stroke-width: 1; fill: none; marker-end: url(#arrow); }
      .line { stroke: #a0aab5; stroke-width: 1; fill: none; }
      .dash { stroke: #8a7aa8; stroke-width: 1; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
