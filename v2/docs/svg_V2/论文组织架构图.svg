  <ns0:rect x="210" y="388" width="130" height="22" rx="5" class="box" />
  <ns0:text x="275" y="403" text-anchor="middle" class="small">2.6 涨势预警</ns0:text>

  <ns0:line x1="133" y1="410" x2="133" y2="418" class="line" />
