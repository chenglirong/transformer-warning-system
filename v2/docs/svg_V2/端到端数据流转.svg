<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" font-family="Hiragino Sans GB W6">
  <ns0:defs>
    <ns0:marker id="arr" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <ns0:polygon points="0,0 5,2.5 0,5" fill="#5D6D7E"/>
    </ns0:marker>
    <ns0:marker id="arrS" markerWidth="5" markerHeight="5" refX="0.5" refY="2.5" orient="auto">
      <ns0:polygon points="5,0 0,2.5 5,5" fill="#5D6D7E"/>
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="960" height="290" fill="#ffffff" />

  <!-- 前端 -->
  <ns0:rect x="30" y="70" width="150" height="80" rx="8" fill="#EAFAF1" stroke="#1E8449" stroke-width="1" />
  <ns0:g transform="translate(88, 67) scale(1.65)" stroke="#1E8449" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ns0:rect x="2" y="3" width="16" height="12" rx="2" />
    <ns0:line x1="10" y1="15" x2="10" y2="18" />
    <ns0:line x1="6" y1="18" x2="14" y2="18" />
  </ns0:g>
  <ns0:text x="105" y="117" text-anchor="middle" fill="#155230" font-size="18" font-weight="600">前　端</ns0:text>
  <ns0:text x="105" y="137" text-anchor="middle" fill="#7F8C8D" font-size="13" font-weight="600">结果展示 · 报告导出</ns0:text>

  <!-- 接口层 -->
  <ns0:rect x="280" y="70" width="160" height="80" rx="8" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1" />
  <ns0:g transform="translate(343, 65) scale(1.65)" stroke="#CA6F1E" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ns0:line x1="3" y1="7" x2="15" y2="7" />
    <ns0:polyline points="12,4 15,7 12,10" />
    <ns0:line x1="17" y1="13" x2="5" y2="13" />
    <ns0:polyline points="8,10 5,13 8,16" />
  </ns0:g>
  <ns0:text x="360" y="117" text-anchor="middle" fill="#7D3C0A" font-size="18" font-weight="600">接口层</ns0:text>
  <ns0:text x="360" y="137" text-anchor="middle" fill="#7F8C8D" font-size="13" font-weight="600">REST API · 统一取数</ns0:text>

  <!-- 智能体 -->
  <ns0:rect x="530" y="70" width="150" height="80" rx="8" fill="#EBF3FB" stroke="#2471A3" stroke-width="2" />
  <ns0:g transform="translate(588, 67) scale(1.65)" stroke="#2471A3" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ns0:rect x="4" y="7" width="12" height="9" rx="2" />
    <ns0:line x1="10" y1="4" x2="10" y2="7" />
    <ns0:circle cx="10" cy="3" r="1" />
    <ns0:circle cx="8" cy="12" r="1" fill="#2471A3" stroke="none" />
    <ns0:circle cx="13" cy="12" r="1" fill="#2471A3" stroke="none" />
  </ns0:g>
  <ns0:text x="605" y="117" text-anchor="middle" fill="#1A3A5C" font-size="18" font-weight="600">智 能 体</ns0:text>
  <ns0:text x="605" y="137" text-anchor="middle" fill="#5D6D7E" font-size="13" font-weight="600">七步工作流</ns0:text>

  <!-- 算法引擎 -->
  <ns0:rect x="780" y="70" width="150" height="80" rx="8" fill="#ffffff" stroke="#2471A3" stroke-width="1" stroke-dasharray="5,3" />
  <ns0:g transform="translate(838, 69) scale(1.65)" stroke="#2471A3" stroke-width="1" fill="none" stroke-linecap="round">
    <ns0:rect x="5" y="5" width="10" height="10" rx="2" />
    <ns0:line x1="8" y1="2" x2="8" y2="5" />
    <ns0:line x1="12" y1="2" x2="12" y2="5" />
    <ns0:line x1="8" y1="15" x2="8" y2="18" />
    <ns0:line x1="12" y1="15" x2="12" y2="18" />
    <ns0:line x1="2" y1="8" x2="5" y2="8" />
    <ns0:line x1="2" y1="12" x2="5" y2="12" />
    <ns0:line x1="15" y1="8" x2="18" y2="8" />
    <ns0:line x1="15" y1="12" x2="18" y2="12" />
  </ns0:g>
  <ns0:text x="855" y="117" text-anchor="middle" fill="#1A3A5C" font-size="18" font-weight="600">算法引擎</ns0:text>
  <ns0:text x="855" y="137" text-anchor="middle" fill="#7F8C8D" font-size="13" font-weight="600">规则计算 + 大模型</ns0:text>

  <!-- ① 发起分析 -->
  <ns0:text x="230" y="92" text-anchor="middle" fill="#5D6D7E" font-size="14" font-weight="600">① 发起分析</ns0:text>
  <ns0:line x1="182" y1="105" x2="274" y2="105" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)" />

  <!-- ③ 调度分析 -->
  <ns0:text x="485" y="92" text-anchor="middle" fill="#5D6D7E" font-size="14" font-weight="600">③ 调度分析</ns0:text>
  <ns0:line x1="444" y1="105" x2="524" y2="105" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)" />

  <!-- ④ 按步调用（双向） -->
  <ns0:text x="730" y="92" text-anchor="middle" fill="#5D6D7E" font-size="14" font-weight="600">④ 按步调用</ns0:text>
  <ns0:line x1="688" y1="105" x2="774" y2="105" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arrS)" />

  <!-- ⑤ 事实包 + 报告 · 经接口层返回 -->
  <ns0:path d="M 605 70 V 30 H 105 V 64" fill="none" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)" />
  <ns0:text x="355" y="20" text-anchor="middle" fill="#5D6D7E" font-size="14" font-weight="600">⑤ 事实包 + 报告 · 经接口层返回</ns0:text>

  <!-- ② 读取数据（接口层 ↔ 数据库） -->
  <ns0:line x1="357" y1="153" x2="357" y2="191" stroke="#5D6D7E" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arrS)" />
  <ns0:text x="365" y="177" fill="#5D6D7E" font-size="14" font-weight="600">② 读取数据</ns0:text>

  <!-- 数据库 -->
  <ns0:rect x="280" y="195" width="150" height="70" rx="8" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1" />
  <ns0:g transform="translate(342, 196) scale(1.3)" stroke="#8E44AD" stroke-width="1" fill="none" stroke-linecap="round">
    <ns0:ellipse cx="10" cy="4" rx="8" ry="3" />
    <ns0:path d="M2 4v12c0 2 4 3 8 3s8-1 8-3V4" />
    <ns0:path d="M2 10c0 2 4 3 8 3s8-1 8-3" />
  </ns0:g>
  <ns0:text x="355" y="237" text-anchor="middle" fill="#4A235A" font-size="18" font-weight="600">SQLite 数据库</ns0:text>
  <ns0:text x="355" y="257" text-anchor="middle" fill="#7F8C8D" font-size="13" font-weight="600">气体时序 · 设备信息</ns0:text>

</ns0:svg>
