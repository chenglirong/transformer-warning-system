<?xml version="1.0" encoding="UTF-8"?>
<!--
  ReAct（推理与行动）范式 — 修正版
  修正：① 观察与思考2之间无省略号，直接箭头相连
        ② 总结答案为独立环节（面板），不再作为箭头标注
  结构：User ─Query→ 思考 → 行动 → 观察 → 思考 → 总结答案 → 生成回答 ─Output→ User
        思考1 与 观察 双箭头指向 循环迭代（多轮交互）
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1120" height="234"
     viewBox="0 68 1120 234"
     font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5D6D7E"/>
    </marker>
  </defs>

  <rect x="0" y="30" width="1120" height="272" fill="#ffffff"/>

  <!-- 标题（左上，同原图） -->
  <text x="30" y="90" fill="#7F8C8D" font-size="13.5" font-weight="600">ReAct（推理与行动）</text>

  <!-- ══ 左列：User 头像 ══ -->
  <circle cx="60" cy="152" r="13" fill="none" stroke="#5D6D7E" stroke-width="2"/>
  <path d="M 37,195 A 23,23 0 0 1 83,195" fill="none" stroke="#5D6D7E" stroke-width="2"/>
  <text x="60" y="216" text-anchor="middle" fill="#5D6D7E" font-size="11" font-weight="600">User</text>

  <!-- Query 箭头：User → 思考1 -->
  <line x1="92" y1="168" x2="134" y2="168" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="113" y="188" text-anchor="middle" fill="#7F8C8D" font-size="10">Query</text>

  <!-- ══ 思考1（橙）面板 140..268，中心204 ══ -->
  <rect x="140" y="130" width="128" height="84" rx="10" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <ellipse cx="180" cy="158" rx="12" ry="8" fill="none" stroke="#CA6F1E" stroke-width="1.5"/>
  <circle cx="166" cy="169" r="3" fill="none" stroke="#CA6F1E" stroke-width="1.2"/>
  <circle cx="158" cy="174" r="2" fill="none" stroke="#CA6F1E" stroke-width="1.2"/>
  <text x="225" y="168" text-anchor="middle" fill="#7D3C0A" font-size="12.5" font-weight="600">思考</text>
  <text x="204" y="196" text-anchor="middle" fill="#A04000" font-size="9">Reasoning</text>

  <!-- 思考1 → 行动 -->
  <line x1="268" y1="172" x2="302" y2="172" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 行动（蓝）面板 308..436，中心372 ══ -->
  <rect x="308" y="130" width="128" height="84" rx="10" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <polygon points="352,142 340,166 349,166 344,184 361,158 351,158 359,142"
           fill="none" stroke="#2471A3" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="395" y="168" text-anchor="middle" fill="#1A3A5C" font-size="12.5" font-weight="600">行动</text>
  <text x="372" y="196" text-anchor="middle" fill="#5D6D7E" font-size="9">Action</text>

  <!-- 行动 → 观察 -->
  <line x1="436" y1="172" x2="470" y2="172" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 观察（绿）面板 476..604，中心540 ══ -->
  <rect x="476" y="130" width="128" height="84" rx="10" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.6"/>
  <path d="M 506,160 Q 518,148 530,160 Q 518,172 506,160 Z" fill="none" stroke="#1E8449" stroke-width="1.6"/>
  <circle cx="518" cy="160" r="3.2" fill="#1E8449"/>
  <text x="560" y="168" text-anchor="middle" fill="#155230" font-size="12.5" font-weight="600">观察</text>
  <text x="540" y="196" text-anchor="middle" fill="#196F3D" font-size="9">Observation</text>

  <!-- 观察 → 思考2（直接相连，无省略号） -->
  <line x1="604" y1="172" x2="638" y2="172" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 思考2（橙）面板 644..772，中心708 ══ -->
  <rect x="644" y="130" width="128" height="84" rx="10" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <ellipse cx="684" cy="158" rx="12" ry="8" fill="none" stroke="#CA6F1E" stroke-width="1.5"/>
  <circle cx="670" cy="169" r="3" fill="none" stroke="#CA6F1E" stroke-width="1.2"/>
  <circle cx="662" cy="174" r="2" fill="none" stroke="#CA6F1E" stroke-width="1.2"/>
  <text x="729" y="168" text-anchor="middle" fill="#7D3C0A" font-size="12.5" font-weight="600">思考</text>
  <text x="708" y="196" text-anchor="middle" fill="#A04000" font-size="9">Reasoning</text>

  <!-- 思考2 → 总结答案 -->
  <line x1="772" y1="172" x2="806" y2="172" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 总结答案（中性灰）面板 812..940，中心876，单行内容垂直居中 ══ -->
  <rect x="812" y="130" width="128" height="84" rx="10" fill="#F4F6F7" stroke="#7F8C8D" stroke-width="1.6"/>
  <!-- 文档勾选图标（组居中：834..918） -->
  <rect x="834" y="152" width="22" height="28" rx="2" fill="none" stroke="#7F8C8D" stroke-width="1.4"/>
  <polyline points="838,164 841,167 847,160" fill="none" stroke="#1E8449" stroke-width="1.8"/>
  <line x1="850" y1="161" x2="852" y2="161" stroke="#7F8C8D" stroke-width="1.2"/>
  <line x1="838" y1="170" x2="852" y2="170" stroke="#7F8C8D" stroke-width="1.2"/>
  <line x1="838" y1="175" x2="849" y2="175" stroke="#7F8C8D" stroke-width="1.2"/>
  <text x="893" y="177" text-anchor="middle" fill="#5D6D7E" font-size="12.5" font-weight="600">总结答案</text>

  <!-- 总结答案 → 生成回答 -->
  <line x1="940" y1="172" x2="966" y2="172" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 生成回答（绿胶囊）972..1092，中心1032 ══ -->
  <rect x="972" y="150" width="120" height="42" rx="21" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.6"/>
  <path d="M 992,160 h 16 a 4,4 0 0 1 4,4 v 7 a 4,4 0 0 1 -4,4 h -9 l -4,5 v -5 h -3 a 4,4 0 0 1 -4,-4 v -7 a 4,4 0 0 1 4,-4 Z"
        fill="none" stroke="#1E8449" stroke-width="1.4"/>
  <text x="1049" y="176" text-anchor="middle" fill="#155230" font-size="11.5" font-weight="600">生成回答</text>

  <!-- ══ 循环迭代（多轮交互）胶囊 356..556，中心456 ══ -->
  <rect x="356" y="228" width="200" height="38" rx="19" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.4"/>
  <path d="M 394,240 A 11,11 0 1 0 406,246" fill="none" stroke="#CA6F1E" stroke-width="1.6"/>
  <polygon points="410,238 408,250 398,244" fill="#CA6F1E"/>
  <text x="476" y="252" text-anchor="middle" fill="#7D3C0A" font-size="11.5" font-weight="600">循环迭代（多轮交互）</text>

  <!-- 思考1 ↓ 经循环迭代 指向 思考2（贯通回路） -->
  <polyline points="204,214 204,246 350,246" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="562,246 708,246 708,220" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 思考2 顶部箭头绕行上方指向 行动 -->
  <polyline points="708,130 708,104 372,104 372,124" fill="none" stroke="#5D6D7E" stroke-width="1.4"
            stroke-dasharray="6,4" marker-end="url(#arr)"/>

  <!-- ══ Output 返回箭头：生成回答 → User ══ -->
  <polyline points="1032,196 1032,286 70,286" fill="none" stroke="#5D6D7E" stroke-width="1.5"
            stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="113" y="278" text-anchor="middle" fill="#7F8C8D" font-size="10">Output</text>

</svg>
