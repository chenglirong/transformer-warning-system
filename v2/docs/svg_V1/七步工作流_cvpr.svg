<?xml version="1.0" encoding="UTF-8"?>
<!--
  图4.2 七步工作流执行流程 — CVPR 风格重绘版
  内容与 七步工作流.svg 完全一致，仅改配色与线型
  原图保留于 七步工作流.svg，本文件不覆盖原图
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="880" height="430"
     viewBox="0 0 880 430"
     font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <rect width="880" height="430" fill="#ffffff"/>

  <!-- ===== 上排（左→右）===== -->

  <!-- 起始节点 -->
  <rect x="30" y="30" width="100" height="50" rx="25"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="80" y="60" text-anchor="middle"
        fill="#155230" font-size="13" font-weight="600">七种气体</text>

  <!-- ① 气体读取 -->
  <rect x="160" y="30" width="100" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="210" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">① 气体读取</text>

  <!-- ② 检测分级 -->
  <rect x="290" y="30" width="100" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="340" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">② 检测分级</text>

  <!-- ③ 产气趋势 -->
  <rect x="420" y="30" width="100" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="470" y="60" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">③ 产气趋势</text>

  <!-- 判断菱形C1 -->
  <polygon points="600,18 665,55 600,92 535,55"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <text x="600" y="50" text-anchor="middle"
        fill="#7D3C0A" font-size="11.5" font-weight="600">含量超</text>
  <text x="600" y="66" text-anchor="middle"
        fill="#7D3C0A" font-size="11.5" font-weight="600">注意值？</text>

  <!-- 上排箭头 -->
  <line x1="130" y1="55" x2="156" y2="55" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="158,55 150,51 150,59" fill="#5D6D7E"/>
  <line x1="260" y1="55" x2="286" y2="55" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="288,55 280,51 280,59" fill="#5D6D7E"/>
  <line x1="390" y1="55" x2="416" y2="55" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="418,55 410,51 410,59" fill="#5D6D7E"/>
  <line x1="520" y1="55" x2="531" y2="55" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="533,55 525,51 525,59" fill="#5D6D7E"/>

  <!-- ===== 右侧拐弯（下）===== -->

  <!-- ④ 处置紧急度 -->
  <rect x="540" y="125" width="120" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="600" y="155" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">④ 处置紧急度</text>

  <!-- 判断菱形C2 -->
  <polygon points="600,213 688,255 600,297 512,255"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <text x="600" y="250" text-anchor="middle"
        fill="#7D3C0A" font-size="11.5" font-weight="600">含量超或</text>
  <text x="600" y="266" text-anchor="middle"
        fill="#7D3C0A" font-size="11.5" font-weight="600">涨势预警？</text>

  <!-- C1 是 → ④ -->
  <line x1="600" y1="92" x2="600" y2="119" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="600,123 596,115 604,115" fill="#5D6D7E"/>
  <text x="615" y="110" fill="#5D6D7E" font-size="11" font-weight="600">是</text>

  <!-- ④ → C2 -->
  <line x1="600" y1="175" x2="600" y2="207" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="600,211 596,203 604,203" fill="#5D6D7E"/>

  <!-- 跳过边1：C1否→C2（虚线） -->
  <path d="M 665 55 Q 780 150 690 253"
        fill="none" stroke="#CA6F1E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="688,255 694,248 683,247" fill="#CA6F1E"/>
  <text x="758" y="145" fill="#CA6F1E" font-size="11" font-weight="600">否，跳过</text>

  <!-- ===== 下排（右→左）===== -->

  <!-- C2 是 → ⑤ -->
  <line x1="600" y1="297" x2="600" y2="334" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="600,338 596,330 604,330" fill="#5D6D7E"/>
  <text x="615" y="322" fill="#5D6D7E" font-size="11" font-weight="600">是</text>

  <!-- ⑤ 故障判型 -->
  <rect x="545" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="600" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">⑤ 故障判型</text>

  <!-- ⑥ 监测决策 -->
  <rect x="405" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="460" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">⑥ 监测决策</text>

  <!-- ⑦ 报告生成 -->
  <rect x="265" y="340" width="110" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="320" y="370" text-anchor="middle"
        fill="#1A3A5C" font-size="13" font-weight="600">⑦ 报告生成</text>

  <!-- 终端节点 -->
  <rect x="60" y="340" width="170" height="50" rx="25"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="145" y="370" text-anchor="middle"
        fill="#155230" font-size="13" font-weight="600">分析结论与报告</text>

  <!-- 下排箭头 -->
  <line x1="545" y1="365" x2="521" y2="365" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="517,365 525,361 525,369" fill="#5D6D7E"/>
  <line x1="405" y1="365" x2="381" y2="365" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="377,365 385,361 385,369" fill="#5D6D7E"/>
  <line x1="265" y1="365" x2="236" y2="365" stroke="#5D6D7E" stroke-width="1.8"/>
  <polygon points="232,365 240,361 240,369" fill="#5D6D7E"/>

  <!-- 跳过边2：C2否→⑥（虚线） -->
  <path d="M 512 255 Q 445 295 455 333"
        fill="none" stroke="#CA6F1E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="455,336 449,328 458,328" fill="#CA6F1E"/>
  <text x="440" y="290" fill="#CA6F1E" font-size="11" font-weight="600">否，跳过</text>

</svg>
