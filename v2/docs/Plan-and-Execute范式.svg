<?xml version="1.0" encoding="UTF-8"?>
<!--
  图4.2 Plan-and-Execute（计划与执行）模式 — 与论文图题统一命名
  修正：① 步骤1/步骤N 双箭头均从框外拐入观察与反思（步骤N 从右侧指入，箭头朝左）
        ② 任务理解/任务规划 副标题统一不带括号
        ③ 所有面板内容（图标+文字组）按面板几何中心居中
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1205" height="252"
     viewBox="0 40 1205 252"
     font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5D6D7E"/>
    </marker>
  </defs>

  <rect width="1205" height="292" fill="#ffffff"/>

  <!-- 标题（左上，同原图） -->
  <text x="30" y="62" fill="#7F8C8D" font-size="13.5" font-weight="600">Plan-and-Execute（计划与执行）</text>

  <!-- ══ 左列：User 头像 ══ -->
  <circle cx="60" cy="152" r="13" fill="none" stroke="#5D6D7E" stroke-width="2"/>
  <path d="M 37,195 A 23,23 0 0 1 83,195" fill="none" stroke="#5D6D7E" stroke-width="2"/>
  <text x="60" y="216" text-anchor="middle" fill="#5D6D7E" font-size="11" font-weight="600">User</text>

  <!-- Query 箭头：User → 任务理解 -->
  <line x1="92" y1="168" x2="134" y2="168" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="113" y="188" text-anchor="middle" fill="#7F8C8D" font-size="10">Query</text>

  <!-- ══ 任务理解（橙）面板 140..268，中心204 ══ -->
  <rect x="140" y="130" width="128" height="100" rx="10" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <!-- 灯泡图标（组居中：163..243） -->
  <circle cx="172" cy="166" r="9" fill="none" stroke="#CA6F1E" stroke-width="1.5"/>
  <line x1="169" y1="177" x2="175" y2="177" stroke="#CA6F1E" stroke-width="1.5"/>
  <line x1="170" y1="181" x2="174" y2="181" stroke="#CA6F1E" stroke-width="1.5"/>
  <text x="217" y="180" text-anchor="middle" fill="#7D3C0A" font-size="12.5" font-weight="600">任务理解</text>
  <text x="204" y="206" text-anchor="middle" fill="#A04000" font-size="9.5">解析用户意图</text>

  <!-- 任务理解 → 任务规划 -->
  <line x1="268" y1="180" x2="302" y2="180" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 任务规划（橙）面板 308..456，中心382 ══ -->
  <rect x="308" y="130" width="148" height="100" rx="10" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.6"/>
  <!-- 清单图标（组居中：340..424） -->
  <rect x="340" y="158" width="22" height="26" rx="2" fill="none" stroke="#CA6F1E" stroke-width="1.4"/>
  <line x1="344" y1="166" x2="352" y2="166" stroke="#CA6F1E" stroke-width="1.2"/>
  <line x1="344" y1="172" x2="358" y2="172" stroke="#CA6F1E" stroke-width="1.2"/>
  <line x1="344" y1="178" x2="355" y2="178" stroke="#CA6F1E" stroke-width="1.2"/>
  <text x="399" y="180" text-anchor="middle" fill="#7D3C0A" font-size="12.5" font-weight="600">任务规划</text>
  <text x="382" y="206" text-anchor="middle" fill="#A04000" font-size="9.5">分解步骤</text>

  <!-- 任务规划 → 执行循环 -->
  <line x1="456" y1="180" x2="490" y2="180" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 执行循环（蓝）面板 496..880，中心688 ══ -->
  <rect x="496" y="96" width="384" height="158" rx="10" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="688" y="122" text-anchor="middle" fill="#1A3A5C" font-size="12.5" font-weight="600">执行循环</text>

  <!-- 步骤链（整链居中于688：560..816） -->
  <rect x="560" y="146" width="60" height="32" rx="6" fill="#ffffff" stroke="#2471A3" stroke-width="1.3"/>
  <text x="590" y="167" text-anchor="middle" fill="#1A3A5C" font-size="10.5" font-weight="600">步骤1</text>
  <line x1="620" y1="162" x2="636" y2="162" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="640" y="146" width="60" height="32" rx="6" fill="#ffffff" stroke="#2471A3" stroke-width="1.3"/>
  <text x="670" y="167" text-anchor="middle" fill="#1A3A5C" font-size="10.5" font-weight="600">步骤2</text>
  <line x1="700" y1="162" x2="716" y2="162" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="728" y="167" text-anchor="middle" fill="#1A3A5C" font-size="11">……</text>
  <line x1="740" y1="162" x2="756" y2="162" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="760" y="146" width="64" height="32" rx="6" fill="#ffffff" stroke="#2471A3" stroke-width="1.3"/>
  <text x="792" y="167" text-anchor="middle" fill="#1A3A5C" font-size="10.5" font-weight="600">步骤N</text>

  <!-- 观察与反思（眼睛图标，框居中于688：610..766） -->
  <rect x="610" y="206" width="156" height="38" rx="19" fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.4"/>
  <path d="M 646,225 Q 656,214 666,225 Q 656,236 646,225 Z" fill="none" stroke="#CA6F1E" stroke-width="1.6"/>
  <circle cx="656" cy="225" r="3.2" fill="#CA6F1E"/>
  <text x="703" y="230" text-anchor="middle" fill="#7D3C0A" font-size="11.5" font-weight="600">观察与反思</text>

  <!-- 步骤1 ↓ 拐入框左侧（箭头朝右指入） -->
  <polyline points="590,178 590,225 606,225" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- 步骤N ↓ 拐入框右侧（箭头朝左指入） -->
  <polyline points="792,178 792,225 770,225" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 执行循环 → 整合结果 -->
  <line x1="880" y1="180" x2="914" y2="180" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 整合结果（绿）面板 920..1030，中心975 ══ -->
  <rect x="920" y="140" width="110" height="80" rx="10" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.6"/>
  <g stroke="#1E8449" stroke-width="1.2" fill="#ffffff">
    <rect x="960" y="152" width="24" height="7" rx="1"/>
    <rect x="963" y="157" width="24" height="7" rx="1"/>
    <rect x="966" y="162" width="24" height="7" rx="1"/>
  </g>
  <text x="975" y="196" text-anchor="middle" fill="#155230" font-size="11.5" font-weight="600">整合结果</text>

  <!-- 整合结果 → 生成回答（同一主带，向右） -->
  <line x1="1030" y1="180" x2="1052" y2="180" stroke="#5D6D7E" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══ 生成回答（绿胶囊）1058..1178，主带中心线，与 ReAct 图一致 ══ -->
  <rect x="1058" y="160" width="120" height="42" rx="21" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.6"/>
  <!-- 对话气泡图标（组居中：1078..1158） -->
  <path d="M 1078,170 h 18 a 4,4 0 0 1 4,4 v 8 a 4,4 0 0 1 -4,4 h -10 l -4,5 v -5 h -4 a 4,4 0 0 1 -4,-4 v -8 a 4,4 0 0 1 4,-4 Z"
        fill="none" stroke="#1E8449" stroke-width="1.4"/>
  <text x="1135" y="186" text-anchor="middle" fill="#155230" font-size="11.5" font-weight="600">生成回答</text>

  <!-- ══ Output 返回箭头：生成回答 → User ══ -->
  <polyline points="1118,206 1118,264 70,264" fill="none" stroke="#5D6D7E" stroke-width="1.5"
            stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="113" y="256" text-anchor="middle" fill="#7F8C8D" font-size="10">Output</text>

</svg>
