<?xml version="1.0" encoding="UTF-8"?>
<!--
  图3.3 多规则协同判断流程 — 字大框小版
  字号：分支标签11.5 / 菱形与结果框13.5 / ①收集14 / ②-⑤标题14.5 / 端点15 / 副标题11~12
  框宽：②-⑤ 320（原380）/ 结果框 150~160（原170~180）/ 端点 300（原340）
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="950" height="1080"
     viewBox="0 0 950 1080"
     font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5D6D7E"/>
    </marker>
  </defs>

  <rect width="950" height="1080" fill="#ffffff"/>

  <!-- ══ 输入（终端样式）══ -->
  <rect x="290" y="20" width="300" height="50" rx="25" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="440" y="42" text-anchor="middle" fill="#155230" font-size="15" font-weight="600">三方判型结果</text>
  <text x="440" y="61" text-anchor="middle" fill="#196F3D" font-size="11">特征气体法 · 三比值法 · 大卫三角形法</text>

  <line x1="440" y1="70" x2="440" y2="86" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ ① 收集性质 ══ -->
  <rect x="290" y="90" width="300" height="44" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="440" y="118" text-anchor="middle" fill="#1A3A5C" font-size="14" font-weight="600">① 收集各方性质</text>

  <line x1="440" y1="134" x2="440" y2="150" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ B1：两票纯性质相反？ ══ -->
  <polygon points="440,154 560,205 440,256 320,205"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.8"/>
  <text x="440" y="200" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">两票纯性质</text>
  <text x="440" y="221" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">相反？</text>

  <!-- B1 是 → 纯性质分歧（左） -->
  <line x1="320" y1="205" x2="216" y2="205" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="268" y="196" text-anchor="middle" fill="#5D6D7E" font-size="11.5">是</text>
  <rect x="60" y="184" width="150" height="42" rx="6" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1.4"/>
  <text x="135" y="211" text-anchor="middle" fill="#7F8C8D" font-size="13.5" font-weight="600">纯性质分歧</text>

  <!-- B1 否 ↓ -->
  <line x1="440" y1="256" x2="440" y2="275" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="450" y="270" fill="#5D6D7E" font-size="11.5">否</text>

  <!-- ══ B2a：有放电兼过热？ ══ -->
  <polygon points="440,279 560,330 440,381 320,330"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.8"/>
  <text x="440" y="335" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">有放电兼过热？</text>

  <!-- B2a 是 → B2b（右） -->
  <line x1="560" y1="330" x2="636" y2="330" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="598" y="321" text-anchor="middle" fill="#5D6D7E" font-size="11.5">是</text>

  <!-- B2a 否 ↓ -->
  <line x1="440" y1="381" x2="440" y2="400" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="450" y="395" fill="#5D6D7E" font-size="11.5">否</text>

  <!-- ══ B2b：也有纯性质？ ══ -->
  <polygon points="730,279 820,330 730,381 640,330"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.8"/>
  <text x="730" y="335" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">也有纯性质？</text>

  <!-- B2b 是 → 放电兼过热（右） -->
  <line x1="820" y1="330" x2="831" y2="330" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="827" y="321" text-anchor="middle" fill="#5D6D7E" font-size="11.5">是</text>
  <rect x="835" y="310" width="100" height="40" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.4"/>
  <text x="885" y="336" text-anchor="middle" fill="#1A3A5C" font-size="13.5" font-weight="600">放电兼过热</text>

  <!-- B2b 否 ↓ 性质一致（仅放电兼过热） -->
  <line x1="730" y1="381" x2="730" y2="428" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="740" y="410" fill="#5D6D7E" font-size="11.5">否</text>
  <rect x="637" y="432" width="186" height="42" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.4"/>
  <text x="730" y="459" text-anchor="middle" fill="#1A3A5C" font-size="13.5" font-weight="600">性质一致（仅放电兼过热）</text>

  <!-- ══ B3：≥2 票纯性质且同指？ ══ -->
  <polygon points="440,404 560,455 440,506 320,455"
           fill="#FEF9F0" stroke="#CA6F1E" stroke-width="1.8"/>
  <text x="440" y="450" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">≥2 票纯性质</text>
  <text x="440" y="471" text-anchor="middle" fill="#7D3C0A" font-size="13.5" font-weight="600">且同指？</text>

  <!-- B3 是 → 性质一致（左） -->
  <line x1="320" y1="455" x2="216" y2="455" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="268" y="446" text-anchor="middle" fill="#5D6D7E" font-size="11.5">是</text>
  <rect x="60" y="434" width="150" height="42" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.4"/>
  <text x="135" y="461" text-anchor="middle" fill="#1A3A5C" font-size="13.5" font-weight="600">性质一致</text>

  <!-- B3 否 ↓ 有效方法不足 -->
  <line x1="440" y1="506" x2="440" y2="526" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="450" y="521" fill="#5D6D7E" font-size="11.5">否</text>
  <rect x="360" y="530" width="160" height="42" rx="6" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1.4"/>
  <text x="440" y="557" text-anchor="middle" fill="#7F8C8D" font-size="13.5" font-weight="600">有效方法不足</text>

  <!-- ══ 五路汇入 综合性质 ══ -->
  <line x1="440" y1="572" x2="440" y2="592" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <!-- 左汇集线：BF、BA -->
  <polyline points="60,205 38,205 38,624 284,624" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="60" y1="455" x2="38" y2="455" stroke="#5D6D7E" stroke-width="1.4"/>
  <!-- 右汇集线：BM、BA2 -->
  <polyline points="885,350 885,624 596,624" fill="none" stroke="#5D6D7E" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="730,474 730,510 881,510" fill="none" stroke="#5D6D7E" stroke-width="1.4"/>

  <rect x="290" y="598" width="300" height="52" rx="26" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="440" y="631" text-anchor="middle" fill="#155230" font-size="15" font-weight="600">综合性质</text>

  <line x1="440" y1="650" x2="440" y2="668" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ ② 主故障名 ══ -->
  <rect x="280" y="672" width="320" height="58" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="440" y="697" text-anchor="middle" fill="#1A3A5C" font-size="14.5" font-weight="600">② 主故障名：按优先级选取</text>
  <text x="440" y="719" text-anchor="middle" fill="#5D6D7E" font-size="11.5">大卫三角 → 三比值 → 特征气体 · 取首个有效结论</text>

  <line x1="440" y1="730" x2="440" y2="748" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ ③ 附注 ══ -->
  <rect x="280" y="752" width="320" height="58" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="440" y="777" text-anchor="middle" fill="#1A3A5C" font-size="14.5" font-weight="600">③ 附注（不改主结论）</text>
  <text x="440" y="799" text-anchor="middle" fill="#5D6D7E" font-size="11">表3.1 油/纸附注 · 辅助比值 CO₂/CO 等</text>

  <line x1="440" y1="810" x2="440" y2="828" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ ④ 可信度定级 ══ -->
  <rect x="280" y="832" width="320" height="58" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="440" y="857" text-anchor="middle" fill="#1A3A5C" font-size="14.5" font-weight="600">④ 可信度定级（按表3.5）</text>
  <text x="440" y="879" text-anchor="middle" fill="#5D6D7E" font-size="11">性质一致度 + 编码落格 + 低浓度 → 高 / 中 / 低</text>

  <line x1="440" y1="890" x2="440" y2="908" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ ⑤ 试验建议 ══ -->
  <rect x="280" y="912" width="320" height="58" rx="6" fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="440" y="937" text-anchor="middle" fill="#1A3A5C" font-size="14.5" font-weight="600">⑤ 试验建议</text>
  <text x="440" y="959" text-anchor="middle" fill="#5D6D7E" font-size="11">依综合性质 + 可信度选取 · 低可信度标『仅核实』</text>

  <line x1="440" y1="970" x2="440" y2="988" stroke="#5D6D7E" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══ 输出 ══ -->
  <rect x="280" y="992" width="320" height="64" rx="32" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="440" y="1020" text-anchor="middle" fill="#155230" font-size="14.5" font-weight="600">输出：主故障名 / 综合性质 / 可信度</text>
  <text x="440" y="1042" text-anchor="middle" fill="#155230" font-size="12">三方推理链 / 附注 / 试验建议</text>

</svg>
