<?xml version="1.0" encoding="UTF-8"?>
<!--
  图3.x 三种故障判型方法流程对比（竖版）
  行1 三比值法/大卫三角形法均为灰色占位框（展示各自使用的气体）
  特征气体法5步；三比值法4步；大卫三角形法3步
  风格基准：七步工作流_cvpr.svg
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="860" height="700"
     viewBox="0 0 860 700"
     font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <rect width="860" height="700" fill="#ffffff"/>

  <!-- ══ 公共输入 ══ -->
  <rect x="270" y="14" width="320" height="38" rx="19"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="430" y="38" text-anchor="middle"
        fill="#155230" font-size="13" font-weight="600">七种溶解气体浓度输入</text>

  <!-- 三叉分叉 -->
  <line x1="430" y1="52" x2="430" y2="70" stroke="#5D6D7E" stroke-width="1.4"/>
  <line x1="140" y1="70" x2="720" y2="70" stroke="#5D6D7E" stroke-width="1.4"/>
  <line x1="140" y1="70" x2="140" y2="84" stroke="#5D6D7E" stroke-width="1.4"/>
  <polygon points="140,87 136,79 144,79" fill="#5D6D7E"/>
  <line x1="430" y1="70" x2="430" y2="84" stroke="#5D6D7E" stroke-width="1.4"/>
  <polygon points="430,87 426,79 434,79" fill="#5D6D7E"/>
  <line x1="720" y1="70" x2="720" y2="84" stroke="#5D6D7E" stroke-width="1.4"/>
  <polygon points="720,87 716,79 724,79" fill="#5D6D7E"/>

  <!-- ══ 列标题 ══ -->
  <rect x="30"  y="88" width="220" height="34" rx="4" fill="#1A3A5C"/>
  <text x="140" y="110" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">特征气体法</text>
  <rect x="320" y="88" width="220" height="34" rx="4" fill="#1A3A5C"/>
  <text x="430" y="110" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">三比值法</text>
  <rect x="610" y="88" width="220" height="34" rx="4" fill="#1A3A5C"/>
  <text x="720" y="110" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">大卫三角形法</text>

  <!--
    行布局（三列对齐，h=56 / 行4 h=70）：
      行1 y=136 h=56  → 192 → arrow→204   （列1实步，列2/3气体占位）
      行2 y=206 h=56  → 262 → arrow→274
      行3 y=276 h=56  → 332 → arrow→344
      行4 y=346 h=70  → 416 → arrow→428
      行5 y=430 h=56  → 486 → arrow→498
      输出 y=500 h=48
    汇合 → 交叉研判 → 最终输出
  -->

  <!-- ═══════════ 列1：特征气体法（5步）═══════════ -->

  <!-- 行1 ① -->
  <rect x="30" y="136" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="140" y="157" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">① 检查有效气体数量</text>
  <text x="140" y="175" text-anchor="middle" fill="#1A3A5C" font-size="10.5">五种特征气体有值 ≥ 3 种</text>
  <text x="140" y="186" text-anchor="middle" fill="#1A3A5C" font-size="10">不足则终止</text>
  <line x1="140" y1="192" x2="140" y2="204" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="140,207 136,199 144,199" fill="#5D6D7E"/>

  <!-- 行2 ② -->
  <rect x="30" y="206" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="140" y="227" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">② 逐行候选匹配（表3.1六行）</text>
  <text x="140" y="244" text-anchor="middle" fill="#1A3A5C" font-size="10.5">主气体烃类须全部出现</text>
  <text x="140" y="255" text-anchor="middle" fill="#1A3A5C" font-size="10">CO/CO₂ 涉纸行单独判断</text>
  <line x1="140" y1="262" x2="140" y2="274" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="140,277 136,269 144,269" fill="#5D6D7E"/>

  <!-- 行3 ③ -->
  <rect x="30" y="276" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="140" y="297" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">③ 固体绝缘涉入判断</text>
  <text x="140" y="314" text-anchor="middle" fill="#1A3A5C" font-size="10.5">CO₂/CO &lt; 3 → 排除涉纸三行</text>
  <text x="140" y="325" text-anchor="middle" fill="#1A3A5C" font-size="10">（油和纸过热/油纸局放/油和纸电弧）</text>
  <line x1="140" y1="332" x2="140" y2="344" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="140,347 136,339 144,339" fill="#5D6D7E"/>

  <!-- 行4 ④ h=70 -->
  <rect x="30" y="346" width="220" height="70" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="140" y="365" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">④ 特征排除（注1/注3/注4）</text>
  <text x="140" y="381" text-anchor="middle" fill="#1A3A5C" font-size="10.5">注1：C₂H₄ &lt; C₂H₆ → 中低温，否则高温</text>
  <text x="140" y="395" text-anchor="middle" fill="#1A3A5C" font-size="10.5">注3：局放行须 H₂/CH₄ 为主且 C₂H₄ 最少</text>
  <text x="140" y="409" text-anchor="middle" fill="#1A3A5C" font-size="10.5">注4：总烃达注意值时淘汰火花放电行</text>
  <line x1="140" y1="416" x2="140" y2="428" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="140,431 136,423 144,423" fill="#5D6D7E"/>

  <!-- 行5 ⑤ -->
  <rect x="30" y="430" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="140" y="451" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">⑤ 多候选择优输出</text>
  <text x="140" y="468" text-anchor="middle" fill="#1A3A5C" font-size="10.5">取主要气体名单最全的一行</text>
  <text x="140" y="479" text-anchor="middle" fill="#1A3A5C" font-size="10">均未命中则"无有效结论"</text>
  <line x1="140" y1="486" x2="140" y2="498" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="140,501 136,493 144,493" fill="#5D6D7E"/>

  <!-- 输出1 -->
  <rect x="30" y="500" width="220" height="48" rx="6"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="140" y="520" text-anchor="middle" fill="#155230" font-size="12" font-weight="600">故障性质方向</text>
  <text x="140" y="537" text-anchor="middle" fill="#155230" font-size="10.5">过热 / 放电 / 涉固体绝缘</text>

  <!-- ═══════════ 列2：三比值法（行1占位 + 4步）═══════════ -->

  <!-- 行1 占位（展示取用气体） -->
  <rect x="320" y="136" width="220" height="56" rx="6"
        fill="#FAFAFA" stroke="#D5D8DC" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="430" y="160" text-anchor="middle" fill="#BDC3C7" font-size="10.5">取 H₂、CH₄、C₂H₂、C₂H₄、C₂H₆</text>
  <text x="430" y="176" text-anchor="middle" fill="#BDC3C7" font-size="10.5">五种特征气体</text>
  <line x1="430" y1="192" x2="430" y2="204" stroke="#D5D8DC" stroke-width="1.4" stroke-dasharray="5,4"/>
  <polygon points="430,207 426,199 434,199" fill="#D5D8DC"/>

  <!-- 行2 ① -->
  <rect x="320" y="206" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="430" y="227" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">① 检查浓度下限</text>
  <text x="430" y="241" text-anchor="middle" fill="#1A3A5C" font-size="10.5">H₂/CH₄/C₂H₄/C₂H₆ ≥ 10 μL/L</text>
  <text x="430" y="255" text-anchor="middle" fill="#1A3A5C" font-size="10.5">C₂H₂ ≥ 1 μL/L，否则终止</text>
  <line x1="430" y1="262" x2="430" y2="274" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,277 426,269 434,269" fill="#5D6D7E"/>

  <!-- 行3 ② -->
  <rect x="320" y="276" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="430" y="297" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">② 计算三对比值</text>
  <text x="430" y="318" text-anchor="middle" fill="#1A3A5C" font-size="10.5">C₂H₂/C₂H₄、CH₄/H₂、C₂H₄/C₂H₆</text>
  <line x1="430" y1="332" x2="430" y2="344" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,347 426,339 434,339" fill="#5D6D7E"/>

  <!-- 行4 ③ h=70 -->
  <rect x="320" y="346" width="220" height="70" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="430" y="371" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">③ 按表3.2编码</text>
  <text x="430" y="388" text-anchor="middle" fill="#1A3A5C" font-size="10.5">每对比值按区间映射 0/1/2</text>
  <text x="430" y="402" text-anchor="middle" fill="#1A3A5C" font-size="10">得三位编码组合</text>
  <line x1="430" y1="416" x2="430" y2="428" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,431 426,423 434,423" fill="#5D6D7E"/>

  <!-- 行5 ④ -->
  <rect x="320" y="430" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="430" y="451" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">④ 查表3.3得故障类型</text>
  <text x="430" y="468" text-anchor="middle" fill="#1A3A5C" font-size="10.5">编码组合 → 故障类型及温区/能级</text>
  <text x="430" y="479" text-anchor="middle" fill="#1A3A5C" font-size="10">查不到则"无对应编码"</text>
  <line x1="430" y1="486" x2="430" y2="498" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,501 426,493 434,493" fill="#5D6D7E"/>

  <!-- 输出2 -->
  <rect x="320" y="500" width="220" height="48" rx="6"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="430" y="520" text-anchor="middle" fill="#155230" font-size="12" font-weight="600">类型编码 + 名称</text>
  <text x="430" y="537" text-anchor="middle" fill="#155230" font-size="10.5">T1/T2/T3/PD/D1/D2/DT</text>

  <!-- ═══════════ 列3：大卫三角形法（行1占位 + 3步 + 行5占位）═══════════ -->

  <!-- 行1 占位 -->
  <rect x="610" y="136" width="220" height="56" rx="6"
        fill="#FAFAFA" stroke="#D5D8DC" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="720" y="160" text-anchor="middle" fill="#BDC3C7" font-size="10.5">取 C₂H₂、C₂H₄、CH₄</text>
  <text x="720" y="176" text-anchor="middle" fill="#BDC3C7" font-size="10.5">三种气体</text>
  <line x1="720" y1="192" x2="720" y2="204" stroke="#D5D8DC" stroke-width="1.4" stroke-dasharray="5,4"/>
  <polygon points="720,207 716,199 724,199" fill="#D5D8DC"/>

  <!-- 行2 ① -->
  <rect x="610" y="206" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="720" y="227" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">① 检查输入有效性</text>
  <text x="720" y="241" text-anchor="middle" fill="#1A3A5C" font-size="10.5">C₂H₂+C₂H₄+CH₄ 均不缺测</text>
  <text x="720" y="255" text-anchor="middle" fill="#1A3A5C" font-size="10.5">且三者浓度之和 &gt; 0</text>
  <line x1="720" y1="262" x2="720" y2="274" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="720,277 716,269 724,269" fill="#5D6D7E"/>

  <!-- 行3 ② -->
  <rect x="610" y="276" width="220" height="56" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="720" y="297" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">② 计算三角坐标 X / Y / Z</text>
  <text x="720" y="318" text-anchor="middle" fill="#1A3A5C" font-size="10.5">三种气体归一化（式3.1～3.3）</text>
  <line x1="720" y1="332" x2="720" y2="344" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="720,347 716,339 724,339" fill="#5D6D7E"/>

  <!-- 行4 ③ h=70 -->
  <rect x="610" y="346" width="220" height="70" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.6"/>
  <text x="720" y="371" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">③ 三角分区定位</text>
  <text x="720" y="388" text-anchor="middle" fill="#1A3A5C" font-size="10.5">按附录C图C.2分区边界落点</text>
  <text x="720" y="402" text-anchor="middle" fill="#1A3A5C" font-size="10">输出区代码及故障类型名称</text>
  <!-- 跳过行5（无此步），虚线直通输出 -->
  <line x1="720" y1="416" x2="720" y2="498" stroke="#5D6D7E" stroke-width="1.6" stroke-dasharray="6,3"/>
  <polygon points="720,501 716,493 724,493" fill="#5D6D7E"/>

  <!-- 行5 占位 -->
  <rect x="610" y="430" width="220" height="56" rx="6"
        fill="#FAFAFA" stroke="#D5D8DC" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="720" y="463" text-anchor="middle" fill="#BDC3C7" font-size="11">—</text>

  <!-- 输出3 -->
  <rect x="610" y="500" width="220" height="48" rx="6"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="720" y="520" text-anchor="middle" fill="#155230" font-size="12" font-weight="600">分区代码 + 名称</text>
  <text x="720" y="537" text-anchor="middle" fill="#155230" font-size="10.5">T1/T2/T3/PD/D1/D2/DT</text>

  <!-- ══ 三路汇合 ══ -->
  <line x1="140" y1="548" x2="140" y2="572" stroke="#5D6D7E" stroke-width="1.6"/>
  <line x1="430" y1="548" x2="430" y2="572" stroke="#5D6D7E" stroke-width="1.6"/>
  <line x1="720" y1="548" x2="720" y2="572" stroke="#5D6D7E" stroke-width="1.6"/>
  <line x1="140" y1="572" x2="720" y2="572" stroke="#5D6D7E" stroke-width="1.6"/>
  <line x1="430" y1="572" x2="430" y2="586" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,589 426,581 434,581" fill="#5D6D7E"/>

  <!-- 交叉研判框 -->
  <rect x="250" y="590" width="360" height="50" rx="6"
        fill="#EBF3FB" stroke="#2471A3" stroke-width="1.8"/>
  <text x="430" y="610" text-anchor="middle" fill="#1A3A5C" font-size="12" font-weight="600">交叉研判（表3.5）</text>
  <text x="430" y="628" text-anchor="middle" fill="#1A3A5C" font-size="10.5">按优先级确定主结论，标注高/中/低可信度</text>

  <line x1="430" y1="640" x2="430" y2="654" stroke="#5D6D7E" stroke-width="1.6"/>
  <polygon points="430,657 426,649 434,649" fill="#5D6D7E"/>

  <!-- 最终输出 -->
  <rect x="185" y="658" width="490" height="38" rx="19"
        fill="#EAFAF1" stroke="#1E8449" stroke-width="1.8"/>
  <text x="430" y="682" text-anchor="middle"
        fill="#155230" font-size="13" font-weight="600">唯一主结论 + 可信度 + 试验建议</text>

</svg>
